<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TelePlay Admin</title><link rel="stylesheet" href="admin.css"></head>
<body>
<div class="wrap">
<header><a href="index.html" class="brand">▶ Tele<span>Play</span></a><span id="status">Not signed in</span><button id="logout" class="danger hidden" onclick="logout()">Log out</button></header>
<section id="loginPanel" class="panel"><h1>Admin Login</h1><p>Sign in with the Supabase account you added as an admin.</p><form onsubmit="login(event)"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" required><button class="primary">Sign in</button></form><p id="loginMsg" class="msg"></p></section>
<section id="adminPanel" class="hidden">
<div class="panel"><div class="head"><h1>Movies</h1><button class="primary" onclick="newMovie()">+ Add movie</button></div><div id="tableWrap"></div></div>
<div id="editor" class="panel hidden"><h2 id="editorTitle">Add movie</h2><form onsubmit="saveMovie(event)" class="form">
<input type="hidden" id="id"><label>Title<input id="title" required></label><label>Year<input id="year" type="number" required></label>
<label>Type<select id="type"><option>Movie</option><option>Series</option></select></label><label>Genre<input id="genre" placeholder="Action, Drama"></label>
<label>Rating<input id="rating" type="number" step="0.1" min="0" max="10" value="8"></label><label>Quality<select id="quality"><option>1080p</option><option>4K</option><option>720p</option></select></label>
<label>Poster URL<input id="poster_url" placeholder="https://.../poster.jpg"></label><label class="check"><input id="featured" type="checkbox"> Trending</label><label class="check"><input id="published" type="checkbox" checked> Published</label>
<div class="actions"><button class="primary">Save</button><button type="button" onclick="closeEditor()">Cancel</button></div><p id="saveMsg" class="msg"></p></form></div>
</section>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="admin.js"></script>
</body></html>
